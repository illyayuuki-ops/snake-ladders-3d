spring:
  application:
    name: snakes-ladders-3d
  profiles:
    active: default

  # ---- Default datasource: H2 file-based (persists across restarts) ----
  datasource:
    url: jdbc:h2:file:../data/snakesladders;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    default-locale: en

# ---- Gemini API Configuration ----
# Set GEMINI_API_KEY environment variable or add gemini.api.key here
gemini:
  api:
    key: ${GEMINI_API_KEY:}

server:
  port: 8080
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ---- Admin authentication ----
admin:
  password: ${ADMIN_PASSWORD:admin123}

---
# ---- Production datasource: PostgreSQL ----
# Env vars (optional): SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Run with: java -jar snakes-ladders-3d.jar --spring.profiles.active=postgres
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/snakesladders
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
