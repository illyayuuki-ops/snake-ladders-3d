<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bodyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fecaca"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <linearGradient id="hairGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7f1d1d"/>
      <stop offset="100%" style="stop-color:#450a0a"/>
    </linearGradient>
    <linearGradient id="outfitGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fecaca"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#b91c1c" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="128" cy="235" rx="55" ry="8" fill="#000" opacity="0.25"/>
  
  <!-- Body/Outfit -->
  <g filter="url(#shadow1)">
    <!-- Legs -->
    <path d="M95 185 Q95 210 105 225 Q110 235 115 230 L115 230" fill="url(#outfitGrad1)" stroke="#b91c1c" stroke-width="1.5"/>
    <path d="M161 185 Q161 210 151 225 Q146 235 141 230 L141 230" fill="url(#outfitGrad1)" stroke="#b91c1c" stroke-width="1.5"/>
    
    <!-- Torso -->
    <path d="M85 125 Q75 135 78 165 L178 165 Q181 135 171 125 Z" fill="url(#outfitGrad1)" stroke="#b91c1c" stroke-width="1.5"/>
    
    <!-- Belt -->
    <rect x="88" y="155" width="80" height="8" rx="2" fill="#7f1d1d"/>
    
    <!-- Arms -->
    <path d="M78 135 Q65 145 60 165 Q58 175 65 180" stroke="url(#bodyGrad1)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M178 135 Q191 145 196 165 Q198 175 191 180" stroke="url(#bodyGrad1)" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- Hands -->
    <circle cx="60" cy="180" r="12" fill="url(#bodyGrad1)" stroke="#b91c1c" stroke-width="1"/>
    <circle cx="196" cy="180" r="12" fill="url(#bodyGrad1)" stroke="#b91c1c" stroke-width="1"/>
  </g>
  
  <!-- Head -->
  <g filter="url(#shadow1)">
    <!-- Face base -->
    <ellipse cx="128" cy="100" rx="42" ry="48" fill="url(#bodyGrad1)" stroke="#b91c1c" stroke-width="1.5"/>
    
    <!-- Hair back -->
    <path d="M86 70 Q70 80 70 110 Q70 130 86 140 L86 140 Q86 120 100 115 Q128 110 156 115 Q170 120 170 140 L170 140 Q186 130 186 110 Q186 80 170 70 Z" fill="url(#hairGrad1)"/>
    
    <!-- Hair front/bangs -->
    <path d="M100 65 Q110 55 128 60 Q146 55 156 65 Q150 75 128 78 Q106 75 100 65 Z" fill="url(#hairGrad1)"/>
    
    <!-- Hair side strands -->
    <path d="M86 90 Q70 100 75 125" stroke="url(#hairGrad1)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M170 90 Q186 100 181 125" stroke="url(#hairGrad1)" stroke-width="6" fill="none" stroke-linecap="round"/>
    
    <!-- Ears -->
    <ellipse cx="86" cy="100" rx="6" ry="10" fill="url(#bodyGrad1)" stroke="#b91c1c" stroke-width="1"/>
    <ellipse cx="170" cy="100" rx="6" ry="10" fill="url(#bodyGrad1)" stroke="#b91c1c" stroke-width="1"/>
    
    <!-- Eyes -->
    <!-- Left eye -->
    <ellipse cx="110" cy="92" rx="14" ry="16" fill="#fff" stroke="#b91c1c" stroke-width="1"/>
    <ellipse cx="112" cy="94" rx="7" ry="8" fill="#7f1d1d"/>
    <ellipse cx="114" cy="92" rx="3" ry="3" fill="#fff"/>
    <ellipse cx="109" cy="96" rx="1.5" ry="1.5" fill="#fff" opacity="0.7"/>
    
    <!-- Right eye -->
    <ellipse cx="146" cy="92" rx="14" ry="16" fill="#fff" stroke="#b91c1c" stroke-width="1"/>
    <ellipse cx="148" cy="94" rx="7" ry="8" fill="#7f1d1d"/>
    <ellipse cx="150" cy="92" rx="3" ry="3" fill="#fff"/>
    <ellipse cx="145" cy="96" rx="1.5" ry="1.5" fill="#fff" opacity="0.7"/>
    
    <!-- Eyebrows -->
    <path d="M100 78 Q110 72 120 78" stroke="#7f1d1d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M136 78 Q146 72 156 78" stroke="#7f1d1d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Blush -->
    <ellipse cx="96" cy="105" rx="8" ry="5" fill="#fecaca" opacity="0.6"/>
    <ellipse cx="160" cy="105" rx="8" ry="5" fill="#fecaca" opacity="0.6"/>
    
    <!-- Mouth -->
    <path d="M120 115 Q128 118 136 115" stroke="#7f1d1d" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Hair front overlay -->
    <path d="M95 60 Q110 45 128 50 Q146 45 161 60 Q155 70 128 73 Q101 70 95 60 Z" fill="url(#hairGrad1)" opacity="0.9"/>
    
    <!-- Ahoge (hair antenna) -->
    <path d="M128 50 Q120 30 130 20 Q135 30 128 50" fill="url(#hairGrad1)" stroke="#7f1d1d" stroke-width="1"/>
  </g>
  
  <!-- Outfit details -->
  <g filter="url(#shadow1)">
    <!-- Collar -->
    <path d="M105 125 Q128 118 151 125 Q140 130 128 135 Q116 130 105 125" fill="#fff" opacity="0.9" stroke="#fecaca" stroke-width="1"/>
    
    <!-- Chest emblem -->
    <circle cx="128" cy="138" r="10" fill="#7f1d1d" opacity="0.3"/>
    <path d="M128 132 L128 144 M122 138 L134 138" stroke="#fecaca" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>