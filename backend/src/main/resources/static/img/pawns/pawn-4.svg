<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bodyGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="hairGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e"/>
      <stop offset="100%" style="stop-color:#78350f"/>
    </linearGradient>
    <linearGradient id="outfitGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#d97706" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="128" cy="235" rx="55" ry="8" fill="#000" opacity="0.25"/>
  
  <!-- Body/Outfit -->
  <g filter="url(#shadow4)">
    <!-- Legs -->
    <path d="M95 185 Q95 210 105 225 Q110 235 115 230 L115 230" fill="url(#outfitGrad4)" stroke="#d97706" stroke-width="1.5"/>
    <path d="M161 185 Q161 210 151 225 Q146 235 141 230 L141 230" fill="url(#outfitGrad4)" stroke="#d97706" stroke-width="1.5"/>
    
    <!-- Torso -->
    <path d="M85 125 Q75 135 78 165 L178 165 Q181 135 171 125 Z" fill="url(#outfitGrad4)" stroke="#d97706" stroke-width="1.5"/>
    
    <!-- Belt -->
    <rect x="88" y="155" width="80" height="8" rx="2" fill="#92400e"/>
    
    <!-- Arms -->
    <path d="M78 135 Q65 145 60 165 Q58 175 65 180" stroke="url(#bodyGrad4)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <path d="M178 135 Q191 145 196 165 Q198 175 191 180" stroke="url(#bodyGrad4)" stroke-width="18" fill="none" stroke-linecap="round"/>
    
    <!-- Hands -->
    <circle cx="60" cy="180" r="12" fill="url(#bodyGrad4)" stroke="#d97706" stroke-width="1"/>
    <circle cx="196" cy="180" r="12" fill="url(#bodyGrad4)" stroke="#d97706" stroke-width="1"/>
  </g>
  
  <!-- Head -->
  <g filter="url(#shadow4)">
    <!-- Face base -->
    <ellipse cx="128" cy="100" rx="42" ry="48" fill="url(#bodyGrad4)" stroke="#d97706" stroke-width="1.5"/>
    
    <!-- Hair back (long, flowing) -->
    <path d="M86 70 Q70 80 70 110 Q70 130 86 140 L86 140 Q86 120 100 115 Q128 110 156 115 Q170 120 170 140 L170 140 Q186 130 186 110 Q186 80 170 70 Z" fill="url(#hairGrad4)"/>
    
    <!-- Long flowing bangs with side sweep -->
    <path d="M95 60 Q110 40 128 50 Q146 40 161 60 Q155 70 128 73 Q101 70 95 60 Z" fill="url(#hairGrad4)"/>
    
    <!-- Hair ribbon/accessory -->
    <ellipse cx="165" cy="75" rx="12" ry="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <path d="M158 75 Q153 70 150 75 Q155 80 158 75" fill="#f59e0b"/>
    
    <!-- Ears -->
    <ellipse cx="86" cy="100" rx="6" ry="10" fill="url(#bodyGrad4)" stroke="#d97706" stroke-width="1"/>
    <ellipse cx="170" cy="100" rx="6" ry="10" fill="url(#bodyGrad4)" stroke="#d97706" stroke-width="1"/>
    
    <!-- Eyes (amber/gold theme) -->
    <!-- Left eye -->
    <ellipse cx="110" cy="92" rx="14" ry="16" fill="#fff" stroke="#d97706" stroke-width="1"/>
    <ellipse cx="112" cy="94" rx="7" ry="8" fill="#92400e"/>
    <ellipse cx="114" cy="92" rx="3" ry="3" fill="#fff"/>
    <ellipse cx="109" cy="96" rx="1.5" ry="1.5" fill="#fff" opacity="0.7"/>
    
    <!-- Right eye -->
    <ellipse cx="146" cy="92" rx="14" ry="16" fill="#fff" stroke="#d97706" stroke-width="1"/>
    <ellipse cx="148" cy="94" rx="7" ry="8" fill="#92400e"/>
    <ellipse cx="150" cy="92" rx="3" ry="3" fill="#fff"/>
    <ellipse cx="145" cy="96" rx="1.5" ry="1.5" fill="#fff" opacity="0.7"/>
    
    <!-- Eyebrows -->
    <path d="M100 78 Q110 72 120 78" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M136 78 Q146 72 156 78" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Blush -->
    <ellipse cx="96" cy="105" rx="8" ry="5" fill="#fde68a" opacity="0.6"/>
    <ellipse cx="160" cy="105" rx="8" ry="5" fill="#fde68a" opacity="0.6"/>
    
    <!-- Mouth (cheerful) -->
    <path d="M118 112 Q128 120 138 112" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Hair side strands (long) -->
    <path d="M86 90 Q65 110 75 145" stroke="url(#hairGrad4)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M170 90 Q191 110 181 145" stroke="url(#hairGrad4)" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Back hair flow -->
    <path d="M165 140 Q180 160 170 180" stroke="url(#hairGrad4)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M91 140 Q76 160 86 180" stroke="url(#hairGrad4)" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Outfit details -->
  <g filter="url(#shadow4)">
    <!-- Collar -->
    <path d="M105 125 Q128 118 151 125 Q140 130 128 135 Q116 130 105 125" fill="#fff" opacity="0.9" stroke="#fde68a" stroke-width="1"/>
    
    <!-- Chest emblem (sun) -->
    <circle cx="128" cy="140" r="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <g stroke="#d97706" stroke-width="1.5" stroke-linecap="round">
      <line x1="128" y1="126" x2="128" y2="120"/>
      <line x1="128" y1="154" x2="128" y2="160"/>
      <line x1="114" y1="140" x2="108" y2="140"/>
      <line x1="142" y1="140" x2="148" y2="140"/>
      <line x1="118" y1="128" x2="114" y2="124"/>
      <line x1="138" y1="152" x2="142" y2="156"/>
      <line x1="118" y1="152" x2="114" y2="156"/>
      <line x1="138" y1="128" x2="142" y2="124"/>
    </g>
  </g>
</svg>