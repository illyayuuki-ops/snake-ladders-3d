<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>3D Snakes &amp; Ladders — Arena Edition</title>
    <!-- Tailwind (progressive enhancement for utility styling in real browsers) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
    <!-- ======================= 3D SCENE ======================= -->
    <div id="scene">
        <div id="board-wrap">
            <div id="board"></div>
        </div>
        <div id="board-hint">Drag to rotate · Scroll / pinch to zoom</div>
    </div>

    <!-- ======================= TOP HUD ======================= -->
    <header id="hud-top" class="glass">
        <div class="brand">
            <span class="logo">🐍🪜</span>
            <div>
                <div class="title">Snakes &amp; Ladders <b>3D</b></div>
                <div class="sub" id="mode-label">Arena Edition</div>
            </div>
        </div>
        <div class="top-stats">
            <div class="stat"><label>Room</label><span id="room-code">—</span></div>
            <div class="stat"><label>Turn</label><span id="turn-count">0</span></div>
            <div class="stat"><label>Variant</label><span id="variant-label">—</span></div>
        </div>
        <div class="top-actions">
            <button id="btn-sound" class="icon-btn" title="Toggle sound">🔊</button>
            <button id="btn-new" class="icon-btn" title="New game">⚙️</button>
        </div>
    </header>

    <!-- ======================= PLAYERS PANEL ======================= -->
    <aside id="players-panel" class="glass">
        <h3>Players</h3>
        <ul id="players-list"></ul>
    </aside>

    <!-- ======================= CONTROLS ======================= -->
    <section id="controls" class="glass">
        <div id="dice" class="dice" title="Dice">
            <div class="dice-cube">
                <div class="face f1"></div><div class="face f2"></div>
                <div class="face f3"></div><div class="face f4"></div>
                <div class="face f5"></div><div class="face f6"></div>
            </div>
        </div>
        <div class="ctrl-buttons">
            <button id="btn-roll" class="primary">🎲 Roll Dice</button>
            <div id="powerups" class="powerups"></div>
        </div>
    </section>

    <!-- ======================= LOG ======================= -->
    <aside id="log-panel" class="glass">
        <h3>Game Log</h3>
        <ul id="log-list"></ul>
    </aside>

    <!-- ======================= LEADERBOARD ======================= -->
    <aside id="leaderboard-panel" class="glass">
        <h3>🏆 Leaderboard</h3>
        <div class="lb-tabs">
            <button data-by="winrate" class="active">Win %</button>
            <button data-by="wins">Wins</button>
            <button data-by="fastest">Fastest</button>
        </div>
        <ol id="leaderboard-list"></ol>
    </aside>

    <!-- ======================= WIN OVERLAY ======================= -->
    <div id="win-overlay" class="overlay hidden">
        <div class="win-card glass">
            <div class="trophy">🏆</div>
            <h2 id="win-title">Winner!</h2>
            <p id="win-sub"></p>
            <button id="btn-play-again" class="primary">Play Again</button>
        </div>
    </div>

    <!-- ======================= SETUP MODAL ======================= -->
    <div id="setup-modal" class="overlay">
        <div class="setup-card glass">
            <h2>Local Game</h2>
            <div class="field">
                <label>Board Variant</label>
                <div class="seg" id="seg-variant">
                    <button data-variant="CLASSIC" class="active">Classic</button>
                    <button data-variant="POWERUP">Power-Up</button>
                    <button data-variant="CHAOS">Chaos</button>
                    <button data-variant="SPEED">Speed</button>
                </div>
            </div>
            <div class="field">
                <label>Players <span id="local-count-label">2</span></label>
                <input id="input-local-count" type="range" min="2" max="4" value="2" />
                <div id="local-names"></div>
            </div>
            <div id="setup-error" class="setup-error"></div>
            <button id="btn-start" class="primary big">Start Game</button>
        </div>
    </div>

    <!-- ======================= TOAST ======================= -->
    <div id="toast" class="hidden"></div>

    <!-- ======================= LIBS + APP ======================= -->
    <script src="/js/api.js"></script>
    <script src="/js/board3d.js"></script>
    <script src="/js/dice.js"></script>
    <script src="/js/engine.js"></script>
    <script src="/js/game.js"></script>
</body>
</html>
